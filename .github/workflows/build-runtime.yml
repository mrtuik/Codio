name: Build arm64 Rlaude runtime

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-runtime:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up QEMU for arm64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build arm64 rootfs with OpenCode
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/dist"

          docker run \
            --platform linux/arm64 \
            --user 0:0 \
            --env QEMU_CPU=max \
            --rm \
            -v "${GITHUB_WORKSPACE}/dist:/out" \
            node:20-alpine \
            sh -euxc '
              apk add --no-cache tar coreutils
              npm install -g opencode-ai
              opencode --version

              # Build directly from the container filesystem. Do not copy or
              # recursively rewrite the full /usr tree: under arm64 QEMU that
              # can spend over an hour walking npm caches and protected files.
              # BootstrapManager repairs all absolute links after extraction.
              # The npm caches are not runtime dependencies and only inflate
              # the archive.
              timeout 20m tar --hard-dereference \
                --exclude='root/.npm' \
                --exclude='root/.cache' \
                --exclude='root/.local' \
                -czf /out/rootfs-arm64-v8a.tar.gz \
                -C / bin sbin usr lib etc root

              # Verify inside an isolated root. A plain test -e here is not
              # enough because the host container can resolve a broken
              # absolute link such as /bin/busybox. Repair only the small
              # executable paths needed for this CI smoke test; the Android
              # extractor performs the complete repair before launch.
              rm -rf /tmp/verify
              mkdir -p /tmp/verify
              timeout 10m tar -xzf /out/rootfs-arm64-v8a.tar.gz -C /tmp/verify

              repair_absolute_link() {
                link="$1"
                if [ -L "$link" ]; then
                  target="$(readlink "$link")"
                  case "$target" in
                    /*)
                      relative="$(realpath -m \
                        --relative-to="$(dirname "$link")" \
                        "/tmp/verify$target")"
                      rm -f "$link"
                      ln -s "$relative" "$link"
                      ;;
                  esac
                fi
              }
              repair_absolute_link /tmp/verify/bin/sh
              repair_absolute_link /tmp/verify/usr/bin/node
              repair_absolute_link /tmp/verify/usr/local/bin/opencode

              # OpenCode already ran successfully before packaging. Running
              # the ARM64 Node binary a second time inside a nested chroot
              # makes QEMU trap even though the archive is valid. Verify the
              # shell and packaged OpenCode entrypoint without re-executing
              # Node under nested emulation.
              timeout 3m chroot /tmp/verify /bin/sh -c \
                "test -x /bin/sh && test -f /usr/local/lib/node_modules/opencode-ai/bin/opencode.exe"
            '

      - name: Calculate SHA-256
        id: hash
        shell: bash
        run: |
          set -euo pipefail
          sha256="$(sha256sum dist/rootfs-arm64-v8a.tar.gz | awk '{print $1}')"
          echo "sha256=${sha256}" >> "${GITHUB_OUTPUT}"
          echo "${sha256}  rootfs-arm64-v8a.tar.gz" > dist/SHA256SUMS

      - name: Create runtime release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: runtime-${{ github.run_number }}
          name: Rlaude runtime ${{ github.run_number }}
          body: |
            ARM64 Rlaude runtime rootfs generated from `node:20-alpine`.

            OpenCode was installed and verified with `opencode --version`.

            SHA-256:
            `${{ steps.hash.outputs.sha256 }}`
          files: |
            dist/rootfs-arm64-v8a.tar.gz
            dist/SHA256SUMS

      - name: Update app runtime manifest
        env:
          RUNTIME_TAG: runtime-${{ github.run_number }}
          RUNTIME_SHA256: ${{ steps.hash.outputs.sha256 }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("app/src/main/assets/runtime-manifest.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          tag = os.environ["RUNTIME_TAG"]
          repository = os.environ["GITHUB_REPOSITORY"]
          manifest["version"] = tag
          manifest["arm64-v8a"]["url"] = (
              f"https://github.com/{repository}/releases/download/"
              f"{tag}/rootfs-arm64-v8a.tar.gz"
          )
          manifest["arm64-v8a"]["sha256"] = os.environ["RUNTIME_SHA256"]
          path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/runtime-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update runtime manifest to ${RUNTIME_TAG}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi