name: Build arm64 Rlaude runtime

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-runtime:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up QEMU for arm64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build arm64 rootfs with OpenCode
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/dist"

          docker run \
            --platform linux/arm64 \
            --user 0:0 \
            --rm \
            -v "${GITHUB_WORKSPACE}/dist:/out" \
            node:20-alpine \
            sh -euxc '
              apk add --no-cache tar coreutils
              npm install -g opencode-ai
              opencode --version

              # Never mutate the live container filesystem. Some Alpine
              # paths (EFI shims, SSL files, and /root) are intentionally
              # protected and can make a recursive in-place rewrite fail
              # even when the container runs as UID 0.
              #
              # Copy the rootfs into a fresh writable staging tree first.
              # GNU tar's no-same-* options make every staged directory
              # writable, while preserving symlinks for the repair pass.
              rm -rf /tmp/rootfs
              mkdir -p /tmp/rootfs
              rm -f /tmp/rootfs-copy.tar
              tar -cf /tmp/rootfs-copy.tar -C / bin sbin usr lib etc root
              tar -xf /tmp/rootfs-copy.tar -C /tmp/rootfs \
                --no-same-owner --no-same-permissions
              rm -f /tmp/rootfs-copy.tar

              # Alpine now merges /bin, /sbin, /lib into /usr/* and leaves
              # ABSOLUTE symlinks behind (e.g. /bin/sh -> /bin/busybox).
              # That works on the real root filesystem, but once this rootfs
              # is extracted under the app's private directory and launched
              # through proot, /bin/sh resolves against the phone's /bin.
              # Repair every absolute link in the writable staging tree.
              find /tmp/rootfs -type l -print | while IFS= read -r link; do
                target="$(readlink "$link")"
                case "$target" in
                  /*)
                    relative="$(realpath -m --relative-to="$(dirname "$link")" "/tmp/rootfs$target")"
                    rm -f "$link"
                    ln -s "$relative" "$link"
                    ;;
                esac
              done

              tar --hard-dereference -czf /out/rootfs-arm64-v8a.tar.gz \
                -C /tmp/rootfs .

              # Verify inside an isolated root. A plain test -e here is not
              # enough because the host container can resolve a broken
              # absolute link such as /bin/busybox.
              rm -rf /tmp/verify
              mkdir -p /tmp/verify
              tar -xzf /out/rootfs-arm64-v8a.tar.gz -C /tmp/verify
              chroot /tmp/verify /bin/sh -c "test -x /bin/sh && opencode --version"
            '

      - name: Calculate SHA-256
        id: hash
        shell: bash
        run: |
          set -euo pipefail
          sha256="$(sha256sum dist/rootfs-arm64-v8a.tar.gz | awk '{print $1}')"
          echo "sha256=${sha256}" >> "${GITHUB_OUTPUT}"
          echo "${sha256}  rootfs-arm64-v8a.tar.gz" > dist/SHA256SUMS

      - name: Create runtime release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: runtime-${{ github.run_number }}
          name: Rlaude runtime ${{ github.run_number }}
          body: |
            ARM64 Rlaude runtime rootfs generated from `node:20-alpine`.

            OpenCode was installed and verified with `opencode --version`.

            SHA-256:
            `${{ steps.hash.outputs.sha256 }}`
          files: |
            dist/rootfs-arm64-v8a.tar.gz
            dist/SHA256SUMS

      - name: Update app runtime manifest
        env:
          RUNTIME_TAG: runtime-${{ github.run_number }}
          RUNTIME_SHA256: ${{ steps.hash.outputs.sha256 }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("app/src/main/assets/runtime-manifest.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          tag = os.environ["RUNTIME_TAG"]
          repository = os.environ["GITHUB_REPOSITORY"]
          manifest["version"] = tag
          manifest["arm64-v8a"]["url"] = (
              f"https://github.com/{repository}/releases/download/"
              f"{tag}/rootfs-arm64-v8a.tar.gz"
          )
          manifest["arm64-v8a"]["sha256"] = os.environ["RUNTIME_SHA256"]
          path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/runtime-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update runtime manifest to ${RUNTIME_TAG}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi