name: Build arm64 Codio runtime

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-runtime:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Build arm64 rootfs with OpenCode
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/dist"

          docker run \
            --platform linux/arm64 \
            --rm \
            -v "${GITHUB_WORKSPACE}/dist:/out" \
            node:20-alpine \
            sh -euxc '
              apk add --no-cache tar
              npm install -g opencode-ai
              opencode --version

              # Alpine now merges /bin, /sbin, /lib into /usr/* and leaves
              # ABSOLUTE symlinks behind (e.g. /bin -> /usr/bin). That works
              # fine on the real root filesystem, but once this rootfs is
              # extracted somewhere else on-device (proot, not real /),
              # the absolute symlink points at the *phones* /usr/bin
              # instead of the extracted one, and /bin/sh disappears.
              # Rewrite any absolute top-level symlinks to relative ones so
              # the archive still works no matter where it lands.
              for d in bin sbin lib; do
                if [ -L "/$d" ]; then
                  target="$(readlink "/$d")"
                  case "$target" in
                    /*) rm "/$d"; ln -s "${target#/}" "/$d" ;;
                  esac
                fi
              done

              tar --hard-dereference -czf /out/rootfs-arm64-v8a.tar.gz \
                -C / \
                bin sbin usr lib etc root

              # Simulate on-device extraction (a different root than the
              # real one) and fail the build here instead of shipping a
              # broken archive.
              mkdir -p /tmp/verify
              tar -xzf /out/rootfs-arm64-v8a.tar.gz -C /tmp/verify
              test -e /tmp/verify/bin/sh || (echo "bin/sh missing after simulated extraction" >&2; exit 1)
            '

      - name: Calculate SHA-256
        id: hash
        shell: bash
        run: |
          set -euo pipefail
          sha256="$(sha256sum dist/rootfs-arm64-v8a.tar.gz | awk '{print $1}')"
          echo "sha256=${sha256}" >> "${GITHUB_OUTPUT}"
          echo "${sha256}  rootfs-arm64-v8a.tar.gz" > dist/SHA256SUMS

      - name: Create runtime release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: runtime-${{ github.run_number }}
          name: Codio runtime ${{ github.run_number }}
          body: |
            ARM64 Codio runtime rootfs generated from `node:20-alpine`.

            OpenCode was installed and verified with `opencode --version`.

            SHA-256:
            `${{ steps.hash.outputs.sha256 }}`
          files: |
            dist/rootfs-arm64-v8a.tar.gz
            dist/SHA256SUMS
