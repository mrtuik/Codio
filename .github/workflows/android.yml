name: Build OpenCode runtime rootfs

on:
  workflow_dispatch:
    inputs:
      opencode_package:
        description: "npm package name for opencode"
        required: false
        default: "opencode-ai"

permissions:
  contents: write

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build rootfs with opencode preinstalled (arm64-v8a)
        run: |
          mkdir -p out
          docker run --rm --platform linux/arm64 \
            -v "$PWD/out:/out" \
            node:20-alpine sh -c "
              set -e
              npm install -g ${{ inputs.opencode_package || 'opencode-ai' }} &&
              opencode --version &&
              tar -czf /out/rootfs-arm64-v8a.tar.gz \
                --exclude='proc/*' --exclude='sys/*' --exclude='dev/*' \
                -C / bin sbin usr lib etc root home opt 2>/dev/null || \
              tar -czf /out/rootfs-arm64-v8a.tar.gz -C / bin sbin usr lib etc root
            "

      - name: Compute SHA-256
        id: sha
        run: |
          HASH=$(sha256sum out/rootfs-arm64-v8a.tar.gz | cut -d' ' -f1)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "arm64-v8a sha256: $HASH"

      - name: Upload as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: runtime-${{ github.run_number }}
          name: OpenCode runtime ${{ github.run_number }}
          body: |
            arm64-v8a rootfs (Alpine + Node.js + opencode preinstalled)
            SHA-256: ${{ steps.sha.outputs.hash }}

            Copy the asset download URL below plus this SHA-256 into
            app/src/main/assets/runtime-manifest.json under "arm64-v8a".
          files: out/rootfs-arm64-v8a.tar.gz
